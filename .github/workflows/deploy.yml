name: Version Increment and Deployment

on:
  workflow_dispatch:
    inputs:
      target_key:
        description: "Version Key to Increment (APP_VERSION or TOOLS_VERSION)"
        required: true
        default: "APP_VERSION"
      version_part:
        description: "Which part of the version to increment (major, minor, or patch)"
        required: true
        default: "patch"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository
    - name: Checkout Repository
      uses: actions/checkout@v3

    # Set up Python and install dependencies
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.x'

    # Install python-dotenv package
    - name: Install dependencies
      run: |
        pip install python-dotenv

    # Run the increment version script
    - name: Increment Version
      run: |
        python scripts/increment_version.py "${{ github.event.inputs.target_key }}" "${{ github.event.inputs.version_part }}"

    # Commit and push the updated .env file
    - name: Commit and Push Changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/paju3125/Flask-App.git
        git add .env
        git commit -m "Incremented ${{ github.event.inputs.target_key }} (${{ github.event.inputs.version_part }})"
        git push origin ${{ github.ref_name }}

    # Deploy Application (Optional Step: You can add your deployment steps here)
    - name: Deploy Flask Application
      run: |
        echo "Deploying the Flask Application..."
        # Add your deploy steps here (e.g., restart a service, etc.)
