name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      target_key:
        description: "The version key to increment (APP_VERSION or TOOLS_VERSION)"
        required: true
        default: "APP_VERSION"
      version_part:
        description: "Which part to increment (major, minor, or patch)"
        required: true
        default: "patch"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the application repository
    - name: Checkout Application Repository
      uses: actions/checkout@v3
      with:
        repository: paju3125/Flask-App
        ref: master

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.x'

    # Step 3: Install dependencies (if needed for version incrementing script)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # If you have any dependencies
        pip install python-dotenv

    # Step 2: Increment the version (just updating the version in .env)
    - name: Increment Version
      run: |
        python scripts/increment_version.py .env "${{ github.event.inputs.target_key }}" "${{ github.event.inputs.version_part }}"

    # Step 3: Create a new Git tag for the release
    - name: Create Git Tag
      run: |
        TAG="v$(date +'%Y%m%d%H%M%S')"  # Custom tag format (can be version-based)
        git tag $TAG
        git push origin $TAG

    # Step 4: Deploy application (or any other deployment steps)
    - name: Deploy Application
      run: |
        echo "Deploying the application with version $TAG"
