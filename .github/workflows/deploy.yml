name: Deploy Application

on:
  push:
    branches:
      - main  # Trigger deployment on push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set up Python environment (optional if you need to run Python scripts)
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'

      # Step 3: Install dependencies (if needed for version incrementing script)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # If you have any dependencies

      # Step 4: Increment Version (using your Python script)
      - name: Increment Version
        run: |
          python scripts/increment_version.py .env APP_VERSION patch  # Adjust the script for your versioning

      # Step 5: Commit version changes (e.g., .env) if necessary
      - name: Commit version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env  # Add the updated version file or other changes
          git commit -m "Update version"

      # Step 6: Create a new Git tag for the version
      - name: Create Git Tag
        run: |
          VERSION=$(python -c 'import sys, os; exec(open("scripts/get_version.py").read()); print(get_version())')  # Replace with your version fetching logic
          TAG="v$VERSION"
          git tag $TAG
          git push origin $TAG

      # Step 7: Deploy the application (add your deployment steps here)
      - name: Deploy Application
        run: |
          echo "Deploying version $TAG"
          # Add your deployment script/commands here
