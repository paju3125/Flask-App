name: Versioning and Deployment

on:
  release:
    types: [created]

jobs:
  release-version:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Get the latest Git tag and update version
      run: |
        # Get the current version from Git tags
        VERSION=$(git describe --tags)
        echo "Version: $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        # If the version doesn't exist, create one
        if [ -z "$VERSION" ]; then
          VERSION="v1.0.0"
          git tag $VERSION
          git push origin $VERSION
        fi

    - name: Deploy to Production (or other environment)
      run: |
        echo "Deploying version $VERSION"
        # Here you can add your deployment steps such as:
        # - Restarting a service
        # - Pushing a Docker container
        # - Triggering other actions
