name: Automated Tagging and Release

on:
  push:
    branches:
      - master

jobs:
  create-tag:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Get latest tag
      id: get_latest_tag
      run: |
        git fetch --tags
        latest_tag=$(git describe --tags `git rev-list --tags --max-count=1`)
        echo "Latest tag: $latest_tag"
        echo "latest_tag=$latest_tag" >> $GITHUB_ENV

    - name: Analyze commit messages
      id: analyze_commits
      run: |
        # Get all commits since the last tag
        commits=$(git log ${{ env.latest_tag }}..HEAD --oneline)
        echo "Commits since last tag:"
        echo "$commits"

        # Default bump type
        bump="patch"

        # Analyze commits for keywords
        if echo "$commits" | grep -q "BREAKING CHANGE"; then
          bump="major"
        elif echo "$commits" | grep -q "feat:"; then
          bump="minor"
        elif echo "$commits" | grep -q "fix:"; then
          bump="patch"
        fi

        echo "Determined bump type: $bump"
        echo "bump=$bump" >> $GITHUB_ENV

    - name: Increment version
      id: increment_version
      run: |
        # Extract latest tag
        latest_tag=${{ env.latest_tag }}
        tag_prefix="v"
        version=${latest_tag#$tag_prefix}  # Remove prefix if any
        major=$(echo $version | cut -d. -f1)
        minor=$(echo $version | cut -d. -f2)
        patch=$(echo $version | cut -d. -f3)

        # Increment version based on bump type
        case "${{ env.bump }}" in
          major)
            major=$((major + 1))
            minor=0
            patch=0
            ;;
          minor)
            minor=$((minor + 1))
            patch=0
            ;;
          patch)
            patch=$((patch + 1))
            ;;
        esac

        new_tag="${tag_prefix}${major}.${minor}.${patch}"
        echo "new_tag=$new_tag" >> $GITHUB_ENV
        echo "New version: $new_tag"

    - name: Create a new Git tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        git tag ${{ env.new_tag }}
        git push origin ${{ env.new_tag }}